services:
  server:
    build: ./server
    ports:
      - "5001:5001"
    depends_on:
      - db
      - ollama

    environment:
      - PORT=5001
      - ALLOWED_ORIGINS=*
      - MONGO_URI=mongodb://db:27017
      - SMTP_USER=your_email@example.com
      - SMTP_PASS=your_email_password
      - ACCESS_TOKEN_CODE=your_access_token_code
      - ACCESS_TOKEN_EXPIRY=your_access_token_expiry
      - REFRESH_TOKEN_CODE=your_refresh_token_code
      - REFRESH_TOKEN_EXPIRY=your_refresh_token_expiry
      - HTTP_ONLY_COOKIE=false
      - SECURE_COOKIE=false
      - OLLAMA_URL=http://ollama:11434/api/chat
      - OLLAMA_IP=your_ollama_ip
      - OLLAMA_PORT=your_ollama_port
      - GEMINI_API_KEY=your_gemini_api_key

    volumes:
      - ./data:/data/db    
    
  client:
    build: ./client
    ports:
      - "5173:5173"

  db:
    image: "mongo:latest"
    container_name: "gptclone-db"
    ports:
      - "27017:27017"
    volumes:
      - "./data:/data/db"
    
  ollama:
    image: "ollama/ollama:latest"
    container_name: "gptclone-ollama"
    ports:
      - "11434:11434"